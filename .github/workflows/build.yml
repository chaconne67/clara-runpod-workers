name: Build Clara RunPod workers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, clara-builder]
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - context: video
            image: clara-video-worker
            tag: 10eros-v1
          - context: image
            image: clara-image-worker
            tag: krea-v2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        shell: bash
        run: |
          set -e
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}"
          docker build -t "$IMAGE" "${{ matrix.context }}"
          docker push "$IMAGE"
