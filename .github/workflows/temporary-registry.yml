name: Temporary RunPod GHCR credential

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  credential:
    runs-on: [self-hosted, clara-builder]
    steps:
      - name: Create short-lived RunPod registry credential
        id: registry
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              "name": "clara-ghcr-canary",
              "username": "chaconne67",
              "password": os.environ["GHCR_TOKEN"],
          }).encode()
          req = urllib.request.Request(
              "https://api.runpod.io/v2/registries",
              data=body,
              headers={
                  "Authorization": "Bearer " + os.environ["RUNPOD_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              print(response.read().decode())
          PY
          )
          REGISTRY_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$RESPONSE")
          printf '{"registry_id":"%s"}\n' "$REGISTRY_ID" > registry.json
          echo "::notice title=RunPod registry credential::$REGISTRY_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: runpod-registry-id
          path: registry.json
          retention-days: 1
      - name: Keep the GitHub token alive for the canary pull
        run: sleep 1800
